name: Build Swizh Android App (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      app_domain:
        description: 'Domain HTTPS Aplikasi Anda (contoh: swizh.id)'
        required: true
        default: 'swizh.id'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node & Java 17
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore & TWA Android Project
        run: |
          npm install -g @bubblewrap/cli
          keytool -genkey -v -keystore swizh.keystore -alias swizh -keyalg RSA -keysize 2048 -validity 10000 -storepass swizh123456 -keypass swizh123456 -dname "CN=Swizh Indonesia, OU=Tech, O=Swizh, L=Medan, S=Sumatera Utara, C=ID"
          mkdir android-app && cd android-app
          cat << 'JSON' > twa-manifest.json
          {
            "packageId": "id.swizh.app",
            "host": "${{ github.event.inputs.app_domain }}",
            "name": "Swizh",
            "launcherName": "Swizh",
            "display": "standalone",
            "themeColor": "#4F46E5",
            "navigationColor": "#FFFFFF",
            "backgroundColor": "#FFFFFF",
            "enableNotifications": true,
            "startUrl": "/dashboard",
            "iconUrl": "https://${{ github.event.inputs.app_domain }}/images/logo-swizh.png",
            "signingKey": { "path": "../swizh.keystore", "alias": "swizh" },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "features": { "locationDelegation": { "enabled": true } },
            "generatorApp": "bubblewrap-cli"
          }
          JSON
          bubblewrap update --manifest=twa-manifest.json --skipPwaValidation
          bubblewrap build --skipPwaValidation

      - name: Upload APK, AAB & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Swizh-PlayStore-Release
          path: |
            android-app/app-release-signed.apk
            android-app/app-release-bundle.aab
            swizh.keystore
