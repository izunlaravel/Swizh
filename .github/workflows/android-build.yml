name: Build Swizh Android App

on:
  workflow_dispatch:
    inputs:
      app_domain:
        description: 'Domain HTTPS Aplikasi Anda (tanpa https://)'
        required: true
        default: 'friendly-waffle-qvxr6rv5gp4pf66pr-8000.app.github.dev'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Swizh Android Project
        env:
          APP_DOMAIN: ${{ github.event.inputs.app_domain }}
        run: |
          mkdir -p mobile-app/www
          echo "<h3>Memuat Swizh...</h3>" > mobile-app/www/index.html
          cd mobile-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Swizh" "id.swizh.app" --web-dir=www
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("capacitor.config.json"));c.server={url:"https://"+process.env.APP_DOMAIN+"/dashboard",cleartext:false,allowNavigation:["*"]};fs.writeFileSync("capacitor.config.json",JSON.stringify(c,null,2));'
          npx cap add android
          node -e 'const fs=require("fs");const p="android/app/src/main/AndroidManifest.xml";let x=fs.readFileSync(p,"utf8");x=x.replace("<application","<uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n    <application");fs.writeFileSync(p,x);'
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Create Play Store Keystore
        run: |
          keytool -genkey -v -keystore swizh-release.keystore -alias swizh -keyalg RSA -keysize 2048 -validity 10000 -storepass swizh123456 -keypass swizh123456 -dname "CN=Swizh Indonesia, OU=IT, O=Swizh, L=Medan, S=Sumatera Utara, C=ID"

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Swizh-Android-Build
          path: |
            mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
            mobile-app/android/app/build/outputs/bundle/release/app-release.aab
            swizh-release.keystore
