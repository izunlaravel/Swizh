name: Build Swizh Android App (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      app_domain:
        description: 'Domain HTTPS Aplikasi Anda (contoh: friendly-waffle-...-8000.app.github.dev)'
        required: true
        default: 'swizh.id'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK & AAB via Capacitor
        run: |
          mkdir -p mobile-wrapper/www
          echo "<h1>Memuat Swizh...</h1>" > mobile-wrapper/www/index.html
          cd mobile-wrapper
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat << 'JSON' > capacitor.config.json
          {
            "appId": "id.swizh.app",
            "appName": "Swizh",
            "webDir": "www",
            "server": {
              "url": "https://${{ github.event.inputs.app_domain }}/dashboard",
              "cleartext": false,
              "allowNavigation": ["*"]
            }
          }
          JSON
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore swizh.keystore -alias swizh -keyalg RSA -keysize 2048 -validity 10000 -storepass swizh123456 -keypass swizh123456 -dname "CN=Swizh Indonesia, OU=Tech, O=Swizh, L=Medan, S=Sumatera Utara, C=ID"

      - name: Upload APK, AAB & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Swizh-Android-Release
          path: |
            mobile-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
            mobile-wrapper/android/app/build/outputs/bundle/release/app-release.aab
            swizh.keystore
